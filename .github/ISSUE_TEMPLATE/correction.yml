name: Korrektur eines Eintrags
description: Ein Shop ist falsch, falsch zugeordnet oder zu Unrecht gelistet
title: "[Korrektur] "
labels: ["korrektur"]
body:
  - type: markdown
    attributes:
      value: |
        **Bitte zuerst lesen:** Dieses Projekt spiegelt fremde Warnlisten. Wir
        prüfen keine Shops und entscheiden nicht über Aufnahme oder Streichung.

        Wenn die **Quelle** (z. B. Stiftung für Konsumentenschutz) Ihren Shop
        listet, ist **sie** zuständig — wenden Sie sich bitte dorthin. Die Listen
        werden hier täglich neu abgeholt, eine Streichung an der Quelle wirkt
        also von selbst. Siehe `NOTICE.md`.

        Dieses Formular ist ausschliesslich für **technische** Fehler in diesem
        Projekt: falsch geparste Domain, Feld-Mapping, das eine Quelle
        unzutreffend wiedergibt, offensichtlich falsche Warnstufe.

        Freizeitprojekt ohne zugesagte Reaktionszeit.

  - type: input
    id: domain
    attributes:
      label: Betroffene Domain
      placeholder: beispiel-shop.ch
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Art des Fehlers
      options:
        - Domain falsch geschrieben / falsche Domain getroffen
        - Falsche Firma zugeordnet
        - Warnstufe zu streng (block statt warn)
        - Eintrag existiert bei der Quelle nicht (mehr)
        - Anderes
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: Was ist falsch, und was wäre korrekt?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Belege (optional)
      description: Links, Screenshots, Handelsregister-Auszug, Korrespondenz mit der Quelle
